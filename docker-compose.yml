services:
  pikabureader:
    build: .
    container_name: pikabureader
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FLASK_DEBUG=0
      # Секрет сессий: задай свой на публичном сервере (иначе
      # сгенерируется автоматически и сохранится в data/secret_key)
      # - SECRET_KEY=change-me
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
